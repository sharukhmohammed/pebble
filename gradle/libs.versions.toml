[versions]
agp                       = "8.9.0"
kotlin                    = "2.1.10"
ksp                       = "2.1.10-1.0.31"
compose-bom               = "2025.03.00"
navigation3               = "1.0.0-alpha04"
koin                      = "4.0.3"
room                      = "2.7.0"
datastore                 = "1.1.3"
coroutines                = "1.10.1"
serialization             = "1.8.1"
activity                  = "1.10.1"
lifecycle                 = "2.9.0"
core-splashscreen         = "1.0.1"
gms-generativeai          = "0.9.0"
turbine                   = "1.2.0"
mockk                     = "1.13.13"

[libraries]
# --- Compose BOM ---
compose-bom               = { group = "androidx.compose",             name = "compose-bom",                    version.ref = "compose-bom" }
compose-ui                = { group = "androidx.compose.ui",          name = "ui" }
compose-ui-graphics       = { group = "androidx.compose.ui",          name = "ui-graphics" }
compose-ui-tooling        = { group = "androidx.compose.ui",          name = "ui-tooling" }
compose-ui-tooling-preview= { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
compose-ui-test-manifest  = { group = "androidx.compose.ui",          name = "ui-test-manifest" }
compose-ui-test-junit4    = { group = "androidx.compose.ui",          name = "ui-test-junit4" }
compose-material3         = { group = "androidx.compose.material3",   name = "material3" }
compose-animation         = { group = "androidx.compose.animation",   name = "animation" }
compose-foundation        = { group = "androidx.compose.foundation",  name = "foundation" }

# --- Activity ---
activity-compose          = { group = "androidx.activity",            name = "activity-compose",               version.ref = "activity" }

# --- Navigation 3 ---
navigation3-runtime       = { group = "androidx.navigation3",         name = "navigation3-runtime",            version.ref = "navigation3" }
navigation3-ui            = { group = "androidx.navigation3",         name = "navigation3-ui",                 version.ref = "navigation3" }

# --- Lifecycle ---
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle",           name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }

# --- Koin ---
koin-android              = { group = "io.insert-koin",               name = "koin-android",                   version.ref = "koin" }
koin-compose              = { group = "io.insert-koin",               name = "koin-compose",                   version.ref = "koin" }
koin-compose-viewmodel    = { group = "io.insert-koin",               name = "koin-compose-viewmodel",          version.ref = "koin" }

# --- Room ---
room-runtime              = { group = "androidx.room",                name = "room-runtime",                   version.ref = "room" }
room-ktx                  = { group = "androidx.room",                name = "room-ktx",                       version.ref = "room" }
room-compiler             = { group = "androidx.room",                name = "room-compiler",                  version.ref = "room" }

# --- DataStore ---
datastore-preferences     = { group = "androidx.datastore",           name = "datastore-preferences",          version.ref = "datastore" }

# --- Coroutines ---
coroutines-core           = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-core",         version.ref = "coroutines" }
coroutines-android        = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android",      version.ref = "coroutines" }
coroutines-test           = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",         version.ref = "coroutines" }

# --- Serialization ---
kotlinx-serialization     = { group = "org.jetbrains.kotlinx",        name = "kotlinx-serialization-json",      version.ref = "serialization" }

# --- On-Device AI ---
gms-generativeai          = { group = "com.google.android.gms",       name = "play-services-generativeai",      version.ref = "gms-generativeai" }

# --- Splash Screen ---
core-splashscreen         = { group = "androidx.core",                name = "core-splashscreen",               version.ref = "core-splashscreen" }

# --- Testing ---
junit                     = { group = "junit",                        name = "junit",                          version = "4.13.2" }
junit-ext                 = { group = "androidx.test.ext",            name = "junit",                          version = "1.2.1" }
turbine                   = { group = "app.cash.turbine",             name = "turbine",                        version.ref = "turbine" }
mockk                     = { group = "io.mockk",                     name = "mockk",                          version.ref = "mockk" }

[plugins]
android-application       = { id = "com.android.application",                   version.ref = "agp" }
android-library           = { id = "com.android.library",                       version.ref = "agp" }
kotlin-android            = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose            = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization      = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                       = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
